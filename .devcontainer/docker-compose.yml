services:
  postgres:
    image: postgres:16
    container_name: dbt_postgres
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
      POSTGRES_DB: dbt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d dbt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dbt:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dbt_dev
    volumes:
      - ../dbt_project:/usr/app
      - ../profiles:/root/.dbt
    working_dir: /usr/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_PROFILES_DIR: /root/.dbt
    command: sleep infinity

volumes:
  postgres_data:
